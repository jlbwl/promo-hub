name: 部署到生产环境（仅业务代码）

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  DEPLOY_DIR: /www/wwwroot/promo-hub
  DOMAIN_NAMES: "www.jlbtg.cn jlbtg.cn"
  SSL_CERT_PATH: /root/certs/www.jlbtg.cn.pem
  SSL_KEY_PATH: /root/certs/www.jlbtg.cn.key
  ACME_ROOT: /var/www/html
  API_URL: "http://127.0.0.1:3000/"
  CERT_DIR: /root/certs

jobs:
  pre-check:
    name: 部署前检查
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.check.outputs.should-deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: 检查是否有环境配置文件
        id: check
        run: |
          if git ls-files | grep -E '\.env$|\.env\.local$|\.env\..*\.local$'; then
            echo "❌ 检测到环境配置文件在 Git 中！"
            exit 1
          fi
          echo "should-deploy=true" >> $GITHUB_OUTPUT

  quality:
    name: 代码质量检查
    needs: pre-check
    if: needs.pre-check.outputs.should-deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 18.20.6
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type Check
        run: pnpm type-check

      - name: Run ESLint
        run: pnpm lint

  build:
    name: 构建应用
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 18.20.6
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Admin
        env:
          VITE_API_BASE_URL: /api
          VITE_ICP_NUMBER: ${{ secrets.VITE_ICP_NUMBER || '' }}
        run: pnpm --filter @promo/admin build

      - name: Build Manager
        env:
          VITE_API_BASE_URL: /api
          VITE_ICP_NUMBER: ${{ secrets.VITE_ICP_NUMBER || '' }}
        run: pnpm --filter @promo/manager build

      - name: Build User
        env:
          VITE_API_BASE_URL: /api
          VITE_ICP_NUMBER: ${{ secrets.VITE_ICP_NUMBER || '' }}
        run: pnpm --filter @promo/user build

      - name: Build API
        run: pnpm --filter @promo/api build

      - name: Upload Admin artifacts
        uses: actions/upload-artifact@v5
        with:
          name: admin-dist
          path: apps/admin/dist

      - name: Upload Manager artifacts
        uses: actions/upload-artifact@v5
        with:
          name: manager-dist
          path: apps/manager/dist

      - name: Upload User artifacts
        uses: actions/upload-artifact@v5
        with:
          name: user-dist
          path: apps/user/dist

      - name: Upload API artifacts
        uses: actions/upload-artifact@v5
        with:
          name: api-dist
          path: apps/api/dist

      - name: Upload Nginx config template
        uses: actions/upload-artifact@v5
        with:
          name: nginx-config-template
          path: config/nginx.conf.template

  deploy:
    name: 部署业务代码到服务器
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download Admin artifacts
        uses: actions/download-artifact@v5
        with:
          name: admin-dist
          path: admin-dist

      - name: Download Manager artifacts
        uses: actions/download-artifact@v5
        with:
          name: manager-dist
          path: manager-dist

      - name: Download User artifacts
        uses: actions/download-artifact@v5
        with:
          name: user-dist
          path: user-dist

      - name: Download API artifacts
        uses: actions/download-artifact@v5
        with:
          name: api-dist
          path: api-dist

      - name: Upload Admin to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "admin-dist/"
          target: "${{ env.DEPLOY_DIR }}/admin/"
          rm: true

      - name: Upload Manager to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "manager-dist/"
          target: "${{ env.DEPLOY_DIR }}/manager/"
          rm: true

      - name: Upload User to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "user-dist/"
          target: "${{ env.DEPLOY_DIR }}/user/"
          rm: true

      - name: Upload API files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "api-dist/"
          target: "${{ env.DEPLOY_DIR }}/api/"
          rm: true

      - name: 部署业务代码（保护已有配置）
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            DEPLOY_DIR="${{ env.DEPLOY_DIR }}"
            CERT_DIR="${{ env.CERT_DIR }}"

            echo "=========================================="
            echo "⚠️ 注意：本部署仅更新业务代码"
            echo "⚠️ 不会覆盖已有的环境配置和 Nginx 配置"
            echo "=========================================="

            mkdir -p /etc/nginx/conf.d
            mkdir -p "$DEPLOY_DIR"
            mkdir -p "$CERT_DIR"

            # =======================
            # 1. 备份已有配置（保护措施）
            # =======================
            echo "📦 备份已有配置..."
            if [ -f "/etc/nginx/conf.d/promo-hub.conf" ]; then
              cp /etc/nginx/conf.d/promo-hub.conf "/etc/nginx/conf.d/promo-hub.conf.backup.$(date +%Y%m%d_%H%M%S)"
              echo "✅ Nginx 配置已备份"
            fi

            if [ -f "$DEPLOY_DIR/api/.env" ]; then
              cp "$DEPLOY_DIR/api/.env" "$DEPLOY_DIR/api/.env.backup.$(date +%Y%m%d_%H%M%S)"
              echo "✅ .env 配置已备份"
            fi

            # =======================
            # 2. 修复 API 目录结构
            # =======================
            echo "🔍 检查 API 目录..."
            cd "$DEPLOY_DIR/api"
            if [ -d "api-dist" ]; then
              echo "✅ 找到 api-dist 目录，正在复制内容..."
              ls -la api-dist/ 2>&1
              cp -r api-dist/* ./ 2>&1
              rm -rf api-dist 2>&1
              echo "✅ api-dist 内容已复制"
            fi

            # =======================
            # 3. 检查并创建 .env（仅在不存在时）
            # =======================
            if [ -f ".env" ]; then
              echo "🔒 .env 文件已存在，保持原样，不覆盖"
            else
              echo "⚠️ .env 文件不存在，创建新的（注意：需手动配置）"
              cat > .env << 'ENVEOF'
# 数据库配置
DB_HOST=${{ secrets.DB_HOST }}
DB_PORT=${{ secrets.DB_PORT }}
DB_USER=${{ secrets.DB_USER }}
DB_PASSWORD=${{ secrets.DB_PASSWORD }}
DB_NAME=${{ secrets.DB_NAME }}

# 应用配置
PORT=3000
NODE_ENV=production

# Session 配置
SESSION_SECRET=${{ secrets.SESSION_SECRET }}

# 管理员配置
ADMIN_PHONE=${{ secrets.ADMIN_PHONE }}
ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}

# 阿里云 SMS 配置
ALIBABA_CLOUD_ACCESS_KEY_ID=${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
ALIBABA_CLOUD_ACCESS_KEY_SECRET=${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
ALIBABA_CLOUD_SMS_SIGN_NAME=${{ secrets.ALIBABA_CLOUD_SMS_SIGN_NAME }}
ALIBABA_CLOUD_SMS_TEMPLATE_CODE=${{ secrets.ALIBABA_CLOUD_SMS_TEMPLATE_CODE }}

# Redis 配置（可选，未配置则使用内存缓存）
REDIS_HOST=${{ secrets.REDIS_HOST || '' }}
REDIS_PORT=${{ secrets.REDIS_PORT || '6379' }}
REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD || '' }}
REDIS_DB=${{ secrets.REDIS_DB || '0' }}

# CORS 配置
CORS_ORIGIN=https://www.jlbtg.cn,https://jlbtg.cn

# 数据目录
DATA_DIR=${{ secrets.DATA_DIR || '/www/wwwroot/promo-hub/api/data' }}
ENVEOF
              echo "✅ .env 文件已创建（首次部署）"
            fi

            # =======================
            # 4. 检查 Nginx 配置（仅在不存在时创建）
            # =======================
            if [ -f "/etc/nginx/conf.d/promo-hub.conf" ]; then
              echo "🔒 Nginx 配置已存在，保持原样，不覆盖"
              echo "🔒 如需更新 Nginx 配置，请手动操作"
            else
              echo "⚠️ Nginx 配置不存在，使用模板创建（首次部署）"
              if [ -f "$DEPLOY_DIR/config/nginx.conf.template" ]; then
                DOMAIN_NAMES="${{ secrets.DOMAIN_NAMES || env.DOMAIN_NAMES }}"
                SSL_CERT_PATH="${{ secrets.SSL_CERT_PATH || env.SSL_CERT_PATH }}"
                SSL_KEY_PATH="${{ secrets.SSL_KEY_PATH || env.SSL_KEY_PATH }}"
                ACME_ROOT="${{ secrets.ACME_ROOT || env.ACME_ROOT }}"
                API_URL="${{ secrets.API_URL || env.API_URL }}"
                PROJECT_ROOT="$DEPLOY_DIR"

                cp "$DEPLOY_DIR/config/nginx.conf.template" /etc/nginx/conf.d/promo-hub.conf
                sed -i "s|\${DOMAIN_NAMES}|$DOMAIN_NAMES|g" /etc/nginx/conf.d/promo-hub.conf
                sed -i "s|\${SSL_CERT_PATH}|$SSL_CERT_PATH|g" /etc/nginx/conf.d/promo-hub.conf
                sed -i "s|\${SSL_KEY_PATH}|$SSL_KEY_PATH|g" /etc/nginx/conf.d/promo-hub.conf
                sed -i "s|\${ACME_ROOT}|$ACME_ROOT|g" /etc/nginx/conf.d/promo-hub.conf
                sed -i "s|\${API_URL}|$API_URL|g" /etc/nginx/conf.d/promo-hub.conf
                sed -i "s|\${PROJECT_ROOT}|$PROJECT_ROOT|g" /etc/nginx/conf.d/promo-hub.conf
                echo "✅ Nginx 配置已从模板创建（首次部署）"
              fi
            fi

            # =======================
            # 5. 检查 SSL 证书
            # =======================
            if [ -f "$CERT_DIR/www.jlbtg.cn.pem" ] && [ -f "$CERT_DIR/www.jlbtg.cn.key" ]; then
              echo "✅ SSL证书已存在"
            else
              echo "⚠️ SSL证书不存在，使用自签名证书进行测试"
              openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
                -keyout "$CERT_DIR/www.jlbtg.cn.key" \
                -out "$CERT_DIR/www.jlbtg.cn.pem" \
                -subj "/C=CN/ST=Beijing/L=Beijing/O=jlbwl/OU=IT/CN=www.jlbtg.cn" 2>/dev/null || true
            fi

            chmod 600 "$CERT_DIR/www.jlbtg.cn.key" 2>/dev/null || true
            chmod 644 "$CERT_DIR/www.jlbtg.cn.pem" 2>/dev/null || true

            # =======================
            # 6. 安装依赖
            # =======================
            if [ ! -f "package.json" ]; then
              echo '{"name":"promo-api","version":"1.0.0","type":"module","dependencies":{"bcryptjs":"^3.0.3","connect-mongo":"^5.1.0","cors":"^2.8.5","dotenv":"^17.4.2","express":"^4.21.0","express-rate-limit":"^8.5.1","express-session":"^1.18.1","multer":"^1.4.5-lts.1","mysql2":"^3.22.3","redis":"^5.12.1","uuid":"^11.0.0"}}' > package.json
              echo "✅ package.json已创建"
            fi

            npm install --production --legacy-peer-deps 2>&1 || true
            echo "✅ npm依赖已安装"

            # =======================
            # 7. 检查 index.js
            # =======================
            if [ ! -f "index.js" ]; then
              echo "❌ 错误：index.js文件不存在！"
              echo "🔍 当前目录内容："
              ls -la
              exit 1
            fi

            # =======================
            # 8. 验证 Nginx 配置
            # =======================
            nginx -t || true

            # =======================
            # 9. 重启 API 服务
            # =======================
            if command -v pm2 >/dev/null 2>&1; then
              pm2 delete promo-api 2>/dev/null || true
              pm2 start index.js --name promo-api
              echo "✅ API服务已启动"
            else
              echo "⚠️ PM2未安装，跳过PM2启动"
            fi

            # =======================
            # 10. 重载 Nginx
            # =======================
            nginx -t && nginx -s reload || true
            echo "✅ Nginx已重载"

            echo ""
            echo "================================================"
            echo " 🎉 业务代码部署完成！"
            echo "================================================"
            echo ""
            echo "📋 保护的配置文件："
            echo "   - /etc/nginx/conf.d/promo-hub.conf 🔒"
            echo "   - $DEPLOY_DIR/api/.env 🔒"
            echo ""
            echo "💡 如需手动修改配置，请："
            echo "   1. SSH 连接到服务器"
            echo "   2. 编辑需要修改的配置文件"
            echo "   3. 运行 nginx -t && nginx -s reload（如修改 Nginx 配置）"
            echo "   4. 运行 pm2 restart promo-api（如修改 .env 配置）"

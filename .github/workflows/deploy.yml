name: 部署到生产环境（仅业务代码）

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  # 不要在部署中途取消：scp 的 rm:true 会先清空目标目录，中途取消会把前端留在 404 状态。
  # 副作用：连续 push 时正在执行的那次会跑完；GitHub 对挂起队列只保留最新一条，中间提交会被跳过。
  cancel-in-progress: false

env:
  DEPLOY_DIR: /www/wwwroot/promo-hub
  DOMAIN_NAMES: "www.jlbtg.cn jlbtg.cn"
  SSL_CERT_PATH: /etc/nginx/ssl/www.jlbtg.cn.pem
  SSL_KEY_PATH: /etc/nginx/ssl/www.jlbtg.cn.key
  ACME_ROOT: /var/www/html
  API_URL: "http://127.0.0.1:3000/"
  CERT_DIR: /etc/nginx/ssl

jobs:
  pre-check:
    name: 部署前检查
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.check.outputs.should-deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: 检查是否有环境配置文件
        id: check
        run: |
          if git ls-files | grep -E '\.env$|\.env\.local$|\.env\..*\.local$'; then
            echo "❌ 检测到环境配置文件在 Git 中！"
            exit 1
          fi
          echo "should-deploy=true" >> $GITHUB_OUTPUT

  quality:
    name: 代码质量检查
    needs: pre-check
    if: needs.pre-check.outputs.should-deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Audit dependencies (fail on high severity)
        run: pnpm audit --audit-level=high

      - name: Type Check
        run: pnpm type-check

      - name: Run ESLint
        run: pnpm lint

      - name: Run Tests
        run: pnpm test

  build:
    name: 构建应用
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Admin
        env:
          VITE_API_BASE_URL: /api
          VITE_ICP_NUMBER: ${{ secrets.VITE_ICP_NUMBER || '' }}
        run: pnpm --filter @promo/admin build

      - name: Build Manager
        env:
          VITE_API_BASE_URL: /api
          VITE_ICP_NUMBER: ${{ secrets.VITE_ICP_NUMBER || '' }}
        run: pnpm --filter @promo/manager build

      - name: Build User
        env:
          VITE_API_BASE_URL: /api
          VITE_ICP_NUMBER: ${{ secrets.VITE_ICP_NUMBER || '' }}
        run: pnpm --filter @promo/user build

      - name: Prepare shared for API build
        run: |
          cd packages/shared
          # 备份原始 package.json
          cp package.json package.json.original
          # 先构建 shared
          pnpm build
          # 修改 package.json 指向构建产物
          node << 'EOF'
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.main = pkg.main.replace('./src/', './dist/').replace('.ts', '.js');
            pkg.types = pkg.types.replace('./src/', './dist/').replace('.ts', '.d.ts');
            Object.keys(pkg.exports).forEach(key => {
              const val = pkg.exports[key];
              if (typeof val === 'string' && val.startsWith('./src/')) {
                pkg.exports[key] = val.replace('./src/', './dist/').replace('.ts', '.js');
              }
            });
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          EOF

      - name: Build API
        run: pnpm --filter @promo/api build

      - name: Prepare shared artifacts
        run: |
          cd packages/shared
          cp package.json package.json.build
          mv package.json.original package.json

      - name: Upload Shared artifacts
        uses: actions/upload-artifact@v7
        with:
          name: shared-dist
          path: |
            packages/shared/dist
            packages/shared/package.json.build
          retention-days: 1

      - name: Upload Admin artifacts
        uses: actions/upload-artifact@v7
        with:
          name: admin-dist
          path: apps/admin/dist
          retention-days: 1

      - name: Upload Manager artifacts
        uses: actions/upload-artifact@v7
        with:
          name: manager-dist
          path: apps/manager/dist
          retention-days: 1

      - name: Upload User artifacts
        uses: actions/upload-artifact@v7
        with:
          name: user-dist
          path: apps/user/dist
          retention-days: 1

      - name: Prepare API deployment package
        run: |
          cd apps/api
          
          # 1. 复制 package.json 并修改 workspace 依赖为本地路径
          cp package.json dist/package.json
          
          # 2. 复制 migrations 和 seeds 目录到 dist
          if [ -d "migrations" ]; then
            cp -r migrations dist/migrations
            echo "✅ migrations 目录已复制到 dist"
          fi
          if [ -d "seeds" ]; then
            cp -r seeds dist/seeds
            echo "✅ seeds 目录已复制到 dist"
          fi
          # 复制 knexfile（迁移配置，服务器上由 tsx 加载执行）
          cp knexfile.ts dist/knexfile.ts
          echo "✅ knexfile.ts 已复制到 dist"
          
          # 3. 修改 package.json，移除 workspace:* 依赖（因为我们会内联 shared）
          node << 'EOF'
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('dist/package.json', 'utf8'));
            
            // 移除 workspace:* 依赖（部署环境不支持）
            if (pkg.dependencies && pkg.dependencies['@promo/shared']) {
              delete pkg.dependencies['@promo/shared'];
              console.log("✅ 已移除 @promo/shared workspace 依赖");
            }
            
            fs.writeFileSync('dist/package.json', JSON.stringify(pkg, null, 2));
          EOF
          
          # 3. 创建 node_modules/@promo/shared 目录并复制 shared 的构建产物
          mkdir -p dist/node_modules/@promo/shared
          
          # 复制 shared 的 dist 目录
          if [ -d "../../packages/shared/dist" ]; then
            cp -r ../../packages/shared/dist/* dist/node_modules/@promo/shared/
            
            # 创建 shared 的 package.json（使用 node 命令避免 YAML 解析问题）
            node -e "
              const fs = require('fs');
              const pkg = {
                name: '@promo/shared',
                version: '1.0.0',
                type: 'module',
                main: './index.js',
                exports: {
                  '.': './index.js',
                  './utils/request': './utils/request.js',
                  './utils/logger': './utils/logger.js',
                  './utils/helpers': './utils/helpers.js',
                  './utils/constants': './utils/constants.js',
                  './utils/errors': './utils/errors.js',
                  './types': './types/index.js'
                }
              };
              fs.writeFileSync('dist/node_modules/@promo/shared/package.json', JSON.stringify(pkg, null, 2));
              console.log('✅ created shared package.json');
            "
            echo "✅ shared 依赖已内联到 API 包"
          else
            echo "❌ 错误: packages/shared/dist 不存在！"
            exit 1
          fi
          
          echo "✅ 部署包准备完成"
          ls -la dist/

          # 4. 生成锁定文件：在 dist 内基于已修正的 package.json 解析依赖树，
          #    服务器端用 npm ci 按此精确安装，消除 npm install 的版本漂移
          cd dist
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if [ ! -s package-lock.json ]; then
            echo "❌ package-lock.json 生成失败，终止部署"
            exit 1
          fi
          echo "✅ package-lock.json 已生成（依赖版本钉死）"

      - name: Upload API artifacts
        uses: actions/upload-artifact@v7
        with:
          name: api-dist
          path: apps/api/dist
          retention-days: 1

      - name: Upload Nginx config template
        uses: actions/upload-artifact@v7
        with:
          name: nginx-config-template
          path: config/nginx.conf.template
          retention-days: 1

  deploy:
    name: 部署业务代码到服务器
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download Admin artifacts
        uses: actions/download-artifact@v7
        with:
          name: admin-dist
          path: admin-dist

      - name: Download Manager artifacts
        uses: actions/download-artifact@v7
        with:
          name: manager-dist
          path: manager-dist

      - name: Download User artifacts
        uses: actions/download-artifact@v7
        with:
          name: user-dist
          path: user-dist

      - name: Download API artifacts
        uses: actions/download-artifact@v7
        with:
          name: api-dist
          path: api-dist

      - name: Download Shared artifacts
        uses: actions/download-artifact@v7
        with:
          name: shared-dist
          path: shared-dist

      # 模板只用于「服务器上还没有站点配置」时创建配置，现有服务器不会被覆盖。
      # 传输失败不阻断部署：远端脚本会判断站点配置是否存在，存在则跳过，不存在则明确报错中止。
      # source 用「目录 + 尾斜杠」= 只拷目录内容，落地为 $DEPLOY_DIR/config/nginx.conf.template（与仓库其它 scp 步骤一致）。
      - name: Download Nginx config template
        id: nginx_template_download
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: nginx-config-template
          path: nginx-config-template

      - name: Upload Nginx config template to server
        id: nginx_template_upload
        continue-on-error: true
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "nginx-config-template/"
          target: "${{ env.DEPLOY_DIR }}/config/"
          rm: false

      - name: 创建发布快照（备份失败则中止部署）
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            DEPLOY_DIR="${{ env.DEPLOY_DIR }}"
            RELEASES_DIR="$DEPLOY_DIR/releases"
            KEEP_RELEASES=3

            # 首次部署（api 目录不存在）没有可备份内容，直接跳过
            if [ ! -d "$DEPLOY_DIR/api" ]; then
              echo "ℹ️ api 目录不存在，判定为首次部署，跳过快照"
              exit 0
            fi

            PREV_SHA=$(cat "$DEPLOY_DIR/RELEASE" 2>/dev/null | tr -d '[:space:]' || true)
            PREV_SHA=${PREV_SHA:-unknown}
            SHORT_SHA=$(echo "$PREV_SHA" | cut -c1-7)
            SNAP="$RELEASES_DIR/$(date +%Y%m%d_%H%M%S)_$SHORT_SHA"

            umask 077
            mkdir -p "$SNAP"
            chmod 700 "$RELEASES_DIR" "$SNAP"
            echo "$PREV_SHA" > "$SNAP/REVISION"

            # 1) .env：存在即必须备份成功，否则中止（避免删除后无法恢复配置）
            if [ ! -f "$DEPLOY_DIR/api/.env" ]; then
              echo "❌ 未找到 $DEPLOY_DIR/api/.env，中止部署（请先人工确认配置）"
              exit 1
            fi
            cp -a "$DEPLOY_DIR/api/.env" "$SNAP/api.env"
            chmod 600 "$SNAP/api.env"
            if ! cmp -s "$DEPLOY_DIR/api/.env" "$SNAP/api.env"; then
              echo "❌ .env 快照校验失败，中止部署"
              exit 1
            fi
            echo "✅ .env 快照完成"

            # 2) 上传文件：存在即必须打包成功且可读，否则中止
            if [ -d "$DEPLOY_DIR/api/data/uploads" ]; then
              tar czf "$SNAP/uploads.tar.gz" -C "$DEPLOY_DIR/api/data" uploads
              tar -tzf "$SNAP/uploads.tar.gz" > /dev/null
              chmod 600 "$SNAP/uploads.tar.gz"
              echo "✅ uploads 快照完成"
            fi

            # 3) API 产物（排除可重建的 node_modules 与运行时数据）
            mkdir -p "$SNAP/api"
            tar cf - -C "$DEPLOY_DIR/api" --exclude=node_modules --exclude=data --exclude=.env . | tar xf - -C "$SNAP/api"
            if [ ! -f "$SNAP/api/index.js" ] && [ ! -f "$SNAP/api/dist/index.js" ]; then
              echo "❌ API 产物快照不完整（缺少 index.js），中止部署"
              exit 1
            fi
            echo "✅ API 产物快照完成"

            # 4) 三端前端产物与 shared 包（必须在 scp rm:true 之前完成）
            for APP in admin manager user; do
              if [ -d "$DEPLOY_DIR/$APP" ]; then
                cp -a "$DEPLOY_DIR/$APP" "$SNAP/$APP"
                if [ ! -d "$SNAP/$APP" ]; then
                  echo "❌ $APP 前端快照失败，中止部署"
                  exit 1
                fi
                echo "✅ $APP 快照完成"
              fi
            done
            if [ -d "$DEPLOY_DIR/shared" ]; then
              cp -a "$DEPLOY_DIR/shared" "$SNAP/shared"
              [ -d "$SNAP/shared" ] || { echo "❌ shared 快照失败，中止部署"; exit 1; }
              echo "✅ shared 快照完成"
            fi

            # 5) 记录最近一次快照，供部署过程中的恢复步骤与回滚脚本使用
            echo "$SNAP" > "$RELEASES_DIR/.last"

            # 6) 仅保留最近 KEEP_RELEASES 份快照
            cd "$RELEASES_DIR"
            ls -1dt */ 2>/dev/null | tail -n +$((KEEP_RELEASES + 1)) | xargs -r rm -rf
            echo "✅ 快照完成：${SNAP}（当前保留 $(ls -1d */ 2>/dev/null | wc -l | tr -d ' ') 份）"

      - name: Upload Admin to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "admin-dist/"
          target: "${{ env.DEPLOY_DIR }}/admin/"
          rm: true

      - name: Upload Manager to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "manager-dist/"
          target: "${{ env.DEPLOY_DIR }}/manager/"
          rm: true

      - name: Upload User to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "user-dist/"
          target: "${{ env.DEPLOY_DIR }}/user/"
          rm: true

      - name: Upload API files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "api-dist/"
          target: "${{ env.DEPLOY_DIR }}/api/"
          rm: true

      - name: Upload Shared to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "shared-dist/"
          target: "${{ env.DEPLOY_DIR }}/shared/"
          rm: true

      - name: 部署业务代码（保护已有配置）
        uses: appleboy/ssh-action@v1.2.0
        # 敏感值只进入本步骤的进程环境，由 ssh-action 的 envs 透传到远端 shell，
        # 不参与脚本正文拼接（避免 secret 被插值进脚本、也避免远端 shell 二次展开）。
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_PHONE: ${{ secrets.ADMIN_PHONE }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          ALIBABA_CLOUD_SMS_SIGN_NAME: ${{ secrets.ALIBABA_CLOUD_SMS_SIGN_NAME }}
          ALIBABA_CLOUD_SMS_TEMPLATE_CODE: ${{ secrets.ALIBABA_CLOUD_SMS_TEMPLATE_CODE }}
          ALIYUN_OCR_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OCR_ACCESS_KEY_ID }}
          ALIYUN_OCR_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OCR_ACCESS_KEY_SECRET }}
          ALIYUN_OCR_ENDPOINT: ${{ secrets.ALIYUN_OCR_ENDPOINT }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_DB: ${{ secrets.REDIS_DB }}
          DATA_DIR: ${{ secrets.DATA_DIR }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: DB_HOST,DB_PORT,DB_USER,DB_PASSWORD,DB_NAME,JWT_SECRET,SESSION_SECRET,ADMIN_PHONE,ADMIN_PASSWORD,ALIBABA_CLOUD_ACCESS_KEY_ID,ALIBABA_CLOUD_ACCESS_KEY_SECRET,ALIBABA_CLOUD_SMS_SIGN_NAME,ALIBABA_CLOUD_SMS_TEMPLATE_CODE,ALIYUN_OCR_ACCESS_KEY_ID,ALIYUN_OCR_ACCESS_KEY_SECRET,ALIYUN_OCR_ENDPOINT,REDIS_HOST,REDIS_PORT,REDIS_PASSWORD,REDIS_DB,DATA_DIR
          script: |
            set -e
            DEPLOY_DIR="${{ env.DEPLOY_DIR }}"
            CERT_DIR="${{ env.CERT_DIR }}"

            echo "=========================================="
            echo "⚠️ 注意：本部署仅更新业务代码"
            echo "⚠️ 不会覆盖已有的环境配置和 Nginx 配置"
            echo "=========================================="

            mkdir -p /etc/nginx/conf.d
            mkdir -p "$DEPLOY_DIR"
            mkdir -p "$CERT_DIR"

            # =======================
            # 1. 备份已有配置（保护措施）
            # =======================
            echo "📦 备份已有配置..."
            if [ -f "/etc/nginx/conf.d/promo-hub.conf" ]; then
              cp /etc/nginx/conf.d/promo-hub.conf "/etc/nginx/conf.d/promo-hub.conf.backup.$(date +%Y%m%d_%H%M%S)"
              echo "✅ Nginx 配置已备份"
            fi

            if [ -f "$DEPLOY_DIR/api/.env" ]; then
              cp "$DEPLOY_DIR/api/.env" "$DEPLOY_DIR/api/.env.backup.$(date +%Y%m%d_%H%M%S)"
              echo "✅ .env 配置已备份"
            fi

            # =======================
            # 2. 验证 Shared 目录
            # =======================
            echo "🔍 检查 Shared 目录..."
            cd "$DEPLOY_DIR/shared"
            if [ -f "package.json.build" ]; then
              mv package.json.build package.json
              echo "✅ package.json.build -> package.json"
            fi
            ls -la

            # =======================
            # 2.5 修复 Shared 目录结构
            # =======================
            echo "🔍 检查 Shared 目录结构..."
            cd "$DEPLOY_DIR/shared"
            if [ -d "shared-dist" ]; then
              echo "✅ 找到 shared-dist 目录，正在复制内容..."
              cp -r shared-dist/* ./ 2>&1
              rm -rf shared-dist 2>&1
              echo "✅ shared-dist 内容已复制"
            fi
            if [ -f "package.json.build" ]; then
              mv package.json.build package.json
              echo "✅ package.json.build -> package.json"
            fi
            ls -la

            # =======================
            # 3. 检查并修复 API 目录结构
            # =======================
            echo "🔍 检查 API 目录内容..."
            cd "$DEPLOY_DIR/api"
            echo "📁 API 目录内容:"
            ls -la
            
            # 如果有 api-dist 子目录，将其内容复制到当前目录
            if [ -d "api-dist" ]; then
              echo "✅ 找到 api-dist 子目录，正在展开..."
              cp -r api-dist/* ./ 2>&1
              rm -rf api-dist 2>&1
              echo "✅ api-dist 内容已展开到当前目录"
              echo "📁 展开后的 API 目录内容:"
              ls -la
            fi

            # =======================
            # 2.8 从发布快照恢复 .env 与上传文件（scp rm:true 清空了 api 目录）
            # =======================
            echo "🔄 从发布快照恢复 .env 与上传文件..."
            SNAP="$(cat "$DEPLOY_DIR/releases/.last" 2>/dev/null || true)"
            if [ -n "$SNAP" ] && [ -f "$SNAP/api.env" ]; then
              cp -a "$SNAP/api.env" "$DEPLOY_DIR/api/.env"
              chmod 600 "$DEPLOY_DIR/api/.env"
              echo "✅ .env 已从快照恢复"
            fi
            if [ -n "$SNAP" ] && [ -f "$SNAP/uploads.tar.gz" ]; then
              mkdir -p "$DEPLOY_DIR/api/data"
              tar xzf "$SNAP/uploads.tar.gz" -C "$DEPLOY_DIR/api/data"
              echo "✅ 上传文件已从快照恢复（$(find "$DEPLOY_DIR/api/data/uploads" -type f 2>/dev/null | wc -l) 个文件）"
            fi

            # =======================
            # 3. 检查并创建 .env（仅在不存在时）
            # 取值全部来自步骤级 env + ssh-action envs，脚本正文里不出现 secret 表达式。
            # =======================
            ENV_FILE="$DEPLOY_DIR/api/.env"
            if [ -f "$ENV_FILE" ]; then
              echo "🔒 .env 文件已存在，保持原样，不覆盖"
            else
              echo "⚠️ .env 文件不存在，创建新的"
              
              # 生成安全的随机密钥（如果 Secrets 未配置）
              # SESSION_SECRET 已不再被代码使用，仅保留为 JWT_SECRET 的历史回退来源
              GEN_JWT_SECRET="${JWT_SECRET:-}"
              if [ -z "$GEN_JWT_SECRET" ]; then
                GEN_JWT_SECRET="${SESSION_SECRET:-}"
              fi
              if [ -z "$GEN_JWT_SECRET" ]; then
                GEN_JWT_SECRET=$(openssl rand -base64 32)
                echo "🔑 自动生成了 JWT_SECRET"
              fi

              # 可选值统一在这里兜底；空值写成 KEY=（单行、无多余空格），不会产生畸形行
              OPT_REDIS_PORT="${REDIS_PORT:-6379}"
              OPT_REDIS_DB="${REDIS_DB:-0}"
              OPT_DATA_DIR="${DATA_DIR:-/www/wwwroot/promo-hub/api/data}"
              
              # 用 printf 写值：值不经过 shell 二次展开，$ / 反引号 / ! / 空格 / = 都按字面写入。
              # 子 shell 内设 umask 077，文件从创建那一刻起就是 600。
              (
                umask 077
                {
                  printf '%s\n' "# 数据库配置"
                  printf 'DB_HOST=%s\n' "$DB_HOST"
                  printf 'DB_PORT=%s\n' "$DB_PORT"
                  printf 'DB_USER=%s\n' "$DB_USER"
                  printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD"
                  printf 'DB_NAME=%s\n' "$DB_NAME"
                  printf '\n'
                  printf '%s\n' "# 应用配置"
                  printf 'PORT=3000\n'
                  printf 'NODE_ENV=production\n'
                  printf '\n'
                  printf '%s\n' "# 鉴权密钥"
                  printf 'JWT_SECRET=%s\n' "$GEN_JWT_SECRET"
                  printf '\n'
                  printf '%s\n' "# 管理员配置"
                  printf 'ADMIN_PHONE=%s\n' "$ADMIN_PHONE"
                  printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD"
                  printf '\n'
                  printf '%s\n' "# 阿里云 SMS 配置"
                  printf 'ALIBABA_CLOUD_ACCESS_KEY_ID=%s\n' "$ALIBABA_CLOUD_ACCESS_KEY_ID"
                  printf 'ALIBABA_CLOUD_ACCESS_KEY_SECRET=%s\n' "$ALIBABA_CLOUD_ACCESS_KEY_SECRET"
                  printf 'ALIBABA_CLOUD_SMS_SIGN_NAME=%s\n' "$ALIBABA_CLOUD_SMS_SIGN_NAME"
                  printf 'ALIBABA_CLOUD_SMS_TEMPLATE_CODE=%s\n' "$ALIBABA_CLOUD_SMS_TEMPLATE_CODE"
                  printf '\n'
                  printf '%s\n' "# 阿里云 OCR 配置（可选，未配置则回退本地识别，不影响启动）"
                  printf 'ALIYUN_OCR_ACCESS_KEY_ID=%s\n' "$ALIYUN_OCR_ACCESS_KEY_ID"
                  printf 'ALIYUN_OCR_ACCESS_KEY_SECRET=%s\n' "$ALIYUN_OCR_ACCESS_KEY_SECRET"
                  printf 'ALIYUN_OCR_ENDPOINT=%s\n' "$ALIYUN_OCR_ENDPOINT"
                  printf '\n'
                  printf '%s\n' "# Redis 配置（可选，未配置则使用内存缓存）"
                  printf 'REDIS_HOST=%s\n' "$REDIS_HOST"
                  printf 'REDIS_PORT=%s\n' "$OPT_REDIS_PORT"
                  printf 'REDIS_PASSWORD=%s\n' "$REDIS_PASSWORD"
                  printf 'REDIS_DB=%s\n' "$OPT_REDIS_DB"
                  printf '\n'
                  printf '%s\n' "# CORS 配置"
                  printf 'CORS_ORIGIN=https://www.jlbtg.cn,https://jlbtg.cn\n'
                  printf '\n'
                  printf '%s\n' "# 数据目录"
                  printf 'DATA_DIR=%s\n' "$OPT_DATA_DIR"
                } > "$ENV_FILE"
              )
              chmod 600 "$ENV_FILE"
              echo "✅ .env 文件已创建（首次部署，权限 600）"
            fi

            # 新建和从快照恢复两条路径都再收紧一次，避免历史文件残留 644
            chmod 600 "$ENV_FILE" 2>/dev/null || true

            # =======================
            # 3.1 .env 必填项校验（当前只打印，不阻断部署）
            # TODO: 观察一个发布周期确认各环境补齐后，把下面的告警分支改为 exit 1，
            #       让缺配置在部署阶段暴露，而不是等到健康检查超时才发现。
            # =======================
            ENV_FILE="$DEPLOY_DIR/api/.env"
            MISSING_ENV=""
            for KEY in DB_HOST DB_PORT DB_USER DB_PASSWORD DB_NAME PORT JWT_SECRET; do
              VAL=$(grep -E "^${KEY}=" "$ENV_FILE" 2>/dev/null | head -n 1 | cut -d= -f2-)
              if [ -z "$VAL" ]; then
                MISSING_ENV="$MISSING_ENV $KEY"
              fi
            done
            if [ -n "$MISSING_ENV" ]; then
              echo "⚠️ .env 缺少必填项:${MISSING_ENV}（本轮不阻断部署，补齐后应改为阻断）"
            else
              echo "✅ .env 必填项齐全"
            fi
            for KEY in ALIYUN_OCR_ACCESS_KEY_ID ALIYUN_OCR_ACCESS_KEY_SECRET; do
              VAL=$(grep -E "^${KEY}=" "$ENV_FILE" 2>/dev/null | head -n 1 | cut -d= -f2-)
              if [ -z "$VAL" ]; then
                echo "ℹ️ 未配置 ${KEY}，OCR 将回退本地识别"
              fi
            done

            # =======================
            # 3.5 创建上传目录
            # =======================
            echo "📁 创建上传目录..."
            # 不 source .env：只按 KEY= 行取值，绝不执行文件内容。
            # 同时把 envs 透传进来的 Secret 从本 shell 环境清掉，避免后面的 npm/knex/pm2 子进程
            # 因 dotenv 不覆盖已有变量而用 CI 值顶掉服务器 .env 里人工维护的值。
            unset DB_HOST DB_PORT DB_USER DB_PASSWORD DB_NAME \
                  JWT_SECRET SESSION_SECRET ADMIN_PHONE ADMIN_PASSWORD \
                  ALIBABA_CLOUD_ACCESS_KEY_ID ALIBABA_CLOUD_ACCESS_KEY_SECRET \
                  ALIBABA_CLOUD_SMS_SIGN_NAME ALIBABA_CLOUD_SMS_TEMPLATE_CODE \
                  ALIYUN_OCR_ACCESS_KEY_ID ALIYUN_OCR_ACCESS_KEY_SECRET ALIYUN_OCR_ENDPOINT \
                  REDIS_HOST REDIS_PORT REDIS_PASSWORD REDIS_DB DATA_DIR 2>/dev/null || true
            CURRENT_DATA_DIR=$(cat "$ENV_FILE" 2>/dev/null | grep -E '^DATA_DIR=' | head -n 1 | cut -d= -f2- || true)
            CURRENT_DATA_DIR="${CURRENT_DATA_DIR:-/www/wwwroot/promo-hub/api/data}"
            mkdir -p "$CURRENT_DATA_DIR/uploads/covers"
            echo "✅ 上传目录已创建: $CURRENT_DATA_DIR/uploads/covers"

            # =======================
            # 4. 检查 Nginx 配置（仅在不存在时创建）
            # =======================
            if [ -f "/etc/nginx/conf.d/promo-hub.conf" ]; then
              echo "🔒 Nginx 配置已存在，保持原样，不覆盖（如需更新请手动操作）"
            else
              echo "⚠️ Nginx 配置不存在，使用模板创建（首次部署 / 新机器重建）"
              TEMPLATE="$DEPLOY_DIR/config/nginx.conf.template"
              if [ ! -f "$TEMPLATE" ]; then
                echo "❌ 站点配置与模板同时缺失：$TEMPLATE 不存在，无法创建 Nginx 配置，中止部署"
                exit 1
              fi

              DOMAIN_NAMES="${{ secrets.DOMAIN_NAMES || env.DOMAIN_NAMES }}"
              SSL_CERT_PATH="${{ secrets.SSL_CERT_PATH || env.SSL_CERT_PATH }}"
              SSL_KEY_PATH="${{ secrets.SSL_KEY_PATH || env.SSL_KEY_PATH }}"
              ACME_ROOT="${{ secrets.ACME_ROOT || env.ACME_ROOT }}"
              API_URL="${{ secrets.API_URL || env.API_URL }}"
              PROJECT_ROOT="$DEPLOY_DIR"

              for KV in "DOMAIN_NAMES=$DOMAIN_NAMES" "SSL_CERT_PATH=$SSL_CERT_PATH" "SSL_KEY_PATH=$SSL_KEY_PATH" "ACME_ROOT=$ACME_ROOT" "API_URL=$API_URL"; do
                if [ -z "${KV#*=}" ]; then
                  echo "❌ 渲染变量为空：${KV%%=*}，无法生成 Nginx 配置，中止部署"
                  exit 1
                fi
              done

              # 先渲染到临时文件并校验，校验通过才安装到 conf.d，避免留下半渲染配置
              TMP_CONF="/tmp/promo-hub.conf.$$"
              cp "$TEMPLATE" "$TMP_CONF"
              sed -i "s|\${DOMAIN_NAMES}|$DOMAIN_NAMES|g" "$TMP_CONF"
              sed -i "s|\${SSL_CERT_PATH}|$SSL_CERT_PATH|g" "$TMP_CONF"
              sed -i "s|\${SSL_KEY_PATH}|$SSL_KEY_PATH|g" "$TMP_CONF"
              sed -i "s|\${ACME_ROOT}|$ACME_ROOT|g" "$TMP_CONF"
              sed -i "s|\${API_URL}|$API_URL|g" "$TMP_CONF"
              sed -i "s|\${PROJECT_ROOT}|$PROJECT_ROOT|g" "$TMP_CONF"

              LEFT_OVER=$(grep -oE '[$][{][A-Za-z_]+[}]' "$TMP_CONF" | sort -u | tr '\n' ' ')
              if [ -n "$LEFT_OVER" ]; then
                echo "❌ Nginx 模板渲染失败，仍有未替换占位符：$LEFT_OVER，中止部署"
                rm -f "$TMP_CONF"
                exit 1
              fi
              for SNIPPET in "listen 443" "server_name $DOMAIN_NAMES" "ssl_certificate " "ssl_certificate_key " "location /api/"; do
                if ! grep -qF "$SNIPPET" "$TMP_CONF"; then
                  echo "❌ 渲染结果缺少关键片段：$SNIPPET，中止部署"
                  rm -f "$TMP_CONF"
                  exit 1
                fi
              done

              install -m 644 "$TMP_CONF" /etc/nginx/conf.d/promo-hub.conf
              rm -f "$TMP_CONF"
              echo "✅ Nginx 配置已从模板创建（首次部署）"
            fi

            # =======================
            # 5. 检查 SSL 证书
            # =======================
            if [ -f "$CERT_DIR/www.jlbtg.cn.pem" ] && [ -f "$CERT_DIR/www.jlbtg.cn.key" ]; then
              echo "✅ SSL证书已存在"
            else
              echo "⚠️ SSL证书不存在，使用自签名证书进行测试"
              openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
                -keyout "$CERT_DIR/www.jlbtg.cn.key" \
                -out "$CERT_DIR/www.jlbtg.cn.pem" \
                -subj "/C=CN/ST=Beijing/L=Beijing/O=jlbwl/OU=IT/CN=www.jlbtg.cn" 2>/dev/null || true
            fi

            chmod 600 "$CERT_DIR/www.jlbtg.cn.key" 2>/dev/null || true
            chmod 644 "$CERT_DIR/www.jlbtg.cn.pem" 2>/dev/null || true

            # =======================
            # 6. 安装依赖
            # =======================
            if [ -f "package.json" ]; then
              echo "✅ package.json已存在（从部署包获取）"
              # 验证 package.json 是否包含必要的依赖
              if ! grep -q "reflect-metadata" package.json; then
                echo "⚠️ package.json 缺少 reflect-metadata，正在添加..."
                npm pkg set dependencies.reflect-metadata="^0.2.2"
              fi
              if ! grep -q "tsyringe" package.json; then
                echo "⚠️ package.json 缺少 tsyringe，正在添加..."
                npm pkg set dependencies.tsyringe="^4.10.0"
              fi
              if ! grep -q "knex" package.json; then
                echo "⚠️ package.json 缺少 knex，正在添加..."
                npm pkg set dependencies.knex="^3.1.0"
              fi
            else
              echo "❌ package.json 不存在，创建包含所有依赖的完整版本"
              printf '%s\n' \
                '{"name":"@promo/api","version":"1.0.0","private":true,"type":"module","dependencies":{"@promo/shared":"workspace:*","bcryptjs":"^3.0.3","cookie-parser":"^1.4.7","cors":"^2.8.5","dotenv":"^17.4.2","express":"^4.21.0","express-rate-limit":"^8.5.1","jsonwebtoken":"^9.0.3","knex":"^3.1.0","multer":"^1.4.5-lts.1","mysql2":"^3.22.3","redis":"^5.12.1","reflect-metadata":"^0.2.2","sharp":"^0.33.5","tsyringe":"^4.10.0","uuid":"^11.0.0"},"overrides":{"qs":"^6.16.1","ip-address":"^10.7.4"}}' \
                > package.json
            fi

            # 非交互 SSH 可能缺少 nvm/homebrew 的 PATH，显式补全
            export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"
            if [ -d "/root/.nvm" ] && [ -f "/root/.nvm/nvm.sh" ]; then
              source /root/.nvm/nvm.sh >/dev/null 2>&1 || true
            fi

            # 可复现安装：优先按 CI 生成的锁定文件精确安装（npm ci 自动清空重建 node_modules）
            # 服务器全局 npm 源是 npmmirror，会把 lock 中 registry.npmjs.org 的 resolved 改写成镜像 CDN，
            # 镜像同步滞后时个别 tarball 会 404（如 ws@8.22.2），因此这里强制官方源并保留一次降级重试
            NPM_OFFICIAL_REGISTRY="https://registry.npmjs.org"
            if [ -f "package-lock.json" ]; then
              npm ci --omit=dev --legacy-peer-deps --no-audit --no-fund --registry="$NPM_OFFICIAL_REGISTRY" \
                || npm install --omit=dev --legacy-peer-deps --no-audit --no-fund --registry="$NPM_OFFICIAL_REGISTRY" \
                || { echo "❌ 依赖安装失败（官方源 npm ci / npm install 均失败），终止部署"; exit 1; }
              echo "✅ 依赖已按锁定文件精确安装（npm ci，官方源，可复现）"
            else
              echo "⚠️ 缺少 package-lock.json，降级为 npm install（不可复现）"
              npm install --omit=dev --legacy-peer-deps --no-audit --no-fund --registry="$NPM_OFFICIAL_REGISTRY" || { echo "❌ npm install 失败，终止部署"; exit 1; }
            fi
            echo "✅ npm依赖已安装（包括 reflect-metadata、tsyringe 和 knex）"
            # overrides 需要 npm >= 8.3；打印出来便于从部署日志判断断言失败的原因
            echo "ℹ️ 服务器 npm 版本：$(npm -v)（overrides 需 >= 8.3）"

            # =======================
            # 6.1 sharp 平台二进制自检（原生包漏装会导致 API 启动崩溃循环）
            # =======================
            echo "🔍 sharp 加载自检..."
            if node -e "import('sharp').then(()=>process.exit(0)).catch(()=>process.exit(1))"; then
              echo "✅ sharp 自检通过"
            else
              echo "⚠️ sharp 无法加载，补装 linux-x64 平台二进制..."
              npm install --no-save --os=linux --cpu=x64 sharp 2>&1 || true
              node -e "import('sharp').then(()=>console.log('✅ sharp 补装后自检通过')).catch((e)=>{console.error('❌ sharp 仍无法加载:', e.message); process.exit(1);})"
            fi

            # =======================
            # 6.5 执行数据库迁移
            # =======================
            echo "🔄 执行数据库迁移..."
            if [ -f "knexfile.ts" ] && [ -d "migrations" ]; then
              # 先打印迁移清单（只读，失败也不影响部署），便于从日志判断本次是否动了 schema
              npx --yes tsx node_modules/knex/bin/cli.js migrate:list --env production || true
              # knexfile/迁移文件为 TS，通过 tsx 加载执行（缺失则临时下载）
              npx --yes tsx node_modules/knex/bin/cli.js migrate:latest --env production || { echo "❌ 数据库迁移失败，终止部署"; exit 1; }
              echo "✅ 数据库迁移完成"
            else
              echo "❌ knexfile.ts 或 migrations 目录缺失，终止部署"
              exit 1
            fi

            # =======================
            # 7. 验证 Shared 包并确保正确部署
            # =======================
            echo "🔍 检查 @promo/shared 包..."

            # npm install 会清掉非 package.json 声明的包（含内联的 @promo/shared），必须重建
            # 优先使用符号链接指向 ../shared（与构建产物 package.json 的 exports 一致）
            mkdir -p "node_modules/@promo"
            if [ ! -e "node_modules/@promo/shared" ]; then
              if [ -d "../shared" ]; then
                ln -sfn "$DEPLOY_DIR/shared" "node_modules/@promo/shared"
                echo "✅ 已建立符号链接 node_modules/@promo/shared -> ../shared"
              elif [ -d "dist/node_modules/@promo/shared" ]; then
                cp -r dist/node_modules/@promo/shared node_modules/@promo/
                echo "✅ 从 dist 复制 @promo/shared 成功"
              else
                echo "❌ 无法找到 @promo/shared 源，终止部署"
                exit 1
              fi
            fi

            # =======================
            # 7.5 关键依赖最终自检（npm install 失败/清包必须在此暴露）
            # =======================
            echo "🔍 关键依赖加载自检..."
            node -e "
              Promise.all([import('@promo/shared'), import('reflect-metadata'), import('tsyringe'), import('sharp'), import('mysql2')])
                .then(() => { console.log('✅ 关键依赖自检通过'); })
                .catch((e) => { console.error('❌ 依赖自检失败:', e.message); process.exit(1); })
            "

            # =======================
            # 7.6 依赖版本断言（只读；overrides 未生效或 npm < 8.3 时在这里暴露）
            # =======================
            echo "🔍 依赖版本断言（qs / ip-address / sanitize-html 修复下限）..."
            ASSERT_ROOT="$DEPLOY_DIR/api" node -e '
              const fs = require("fs");
              const path = require("path");
              const root = process.env.ASSERT_ROOT || process.cwd();
              const floors = {
                "qs": "6.16.1",
                "ip-address": "10.7.4",
                "sanitize-html": "2.18.0",
              };
              const cmp = (a, b) => {
                for (let i = 0; i < 3; i++) {
                  const x = a[i] || 0;
                  const y = b[i] || 0;
                  if (x !== y) return x - y;
                }
                return 0;
              };
              const bad = [];
              for (const [name, floor] of Object.entries(floors)) {
                const p = path.join(root, "node_modules", name, "package.json");
                if (!fs.existsSync(p)) {
                  bad.push(name + ": 未安装（要求 >= " + floor + "）");
                  continue;
                }
                const actual = JSON.parse(fs.readFileSync(p, "utf8")).version || "0.0.0";
                const a = actual.replace(/^[^0-9]*/, "").split("-")[0].split(".").map(Number);
                const b = floor.split(".").map(Number);
                if (cmp(a, b) < 0) bad.push(name + ": 实际 " + actual + "，要求 >= " + floor);
                else console.log("   ✅ " + name + " " + actual + " >= " + floor);
              }
              if (bad.length) {
                console.error("❌ 依赖版本断言失败（npm overrides 可能未生效，或 npm < 8.3）：");
                bad.forEach((line) => console.error("   - " + line));
                process.exit(1);
              }
              console.log("✅ 依赖版本断言通过");
            '

            # =======================
            # 8. 检查 index.js
            # =======================
            if [ -f "dist/index.js" ]; then
              echo "✅ dist/index.js 存在"
              API_ENTRY="dist/index.js"
            elif [ -f "index.js" ]; then
              echo "✅ index.js 存在"
              API_ENTRY="index.js"
            else
              echo "❌ 错误：入口文件不存在！"
              echo "🔍 当前目录内容："
              ls -la
              echo "🔍 dist目录内容（如果存在）："
              ls -la dist 2>/dev/null || true
              exit 1
            fi

            # =======================
            # 9. 验证 Nginx 配置
            # =======================
            nginx -t || true

            # =======================
            # 10. 重启 API 服务（找不到 PM2 必须失败，绝不允许静默跳过）
            # =======================
            PM2_BIN="$(command -v pm2 || true)"
            if [ -z "$PM2_BIN" ]; then
              for candidate in /usr/local/bin/pm2 /usr/bin/pm2 /root/.nvm/versions/node/*/bin/pm2; do
                if [ -x "$candidate" ]; then PM2_BIN="$candidate"; break; fi
              done
            fi
            if [ -n "$PM2_BIN" ]; then
              "$PM2_BIN" delete promo-api 2>/dev/null || true
              "$PM2_BIN" start "$API_ENTRY" --name promo-api --time
              echo "✅ API服务已启动 (入口文件: $API_ENTRY)"
            else
              echo "❌ 错误：PM2 不可用，无法重启 API，终止部署"
              exit 1
            fi

            # =======================
            # 10.5 健康检查（重启后必须探测通过，否则判定部署失败）
            # =======================
            echo "🔍 API 健康检查..."
            HEALTH_OK=""
            for i in $(seq 1 15); do
              sleep 2
              if curl -sf -m 5 http://127.0.0.1:3000/api/health > /dev/null 2>&1; then
                HEALTH_OK="yes"
                echo "✅ API 健康检查通过（第 ${i} 次探测）"
                break
              fi
              echo "⏳ 第 ${i} 次探测失败，等待重试..."
            done
            if [ -z "$HEALTH_OK" ]; then
              echo "❌ API 健康检查 30 秒内未通过，部署失败！"
              echo "--- pm2 状态 ---"
              "$PM2_BIN" list || true
              echo "--- 最近错误日志 ---"
              tail -30 /root/.pm2/logs/promo-api-error.log 2>/dev/null || true
              exit 1
            fi

            # 记录部署版本，便于核对线上运行版本
            echo "${{ github.sha }}" > "$DEPLOY_DIR/RELEASE"
            echo "📌 部署版本: ${{ github.sha }}"

            # =======================
            # 11. 重载 Nginx
            # =======================
            nginx -t && nginx -s reload || true
            echo "✅ Nginx已重载"

            echo ""
            echo "================================================"
            echo " 🎉 业务代码部署完成！"
            echo "================================================"
            echo ""
            echo "📋 保护的配置文件："
            echo "   - /etc/nginx/conf.d/promo-hub.conf 🔒"
            echo "   - $DEPLOY_DIR/api/.env 🔒"
            echo ""
            echo "💡 如需手动修改配置，请："
            echo "   1. SSH 连接到服务器"

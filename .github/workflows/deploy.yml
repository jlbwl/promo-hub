name: Deploy to Aliyun Server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEPLOY_DIR: /www/wwwroot/promo-hub

jobs:
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type Check
        run: pnpm type-check

      - name: Test
        run: pnpm test

  build:
    name: Build Applications
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Admin
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://promo-hub.example.com/api' }}
          VITE_ICP_NUMBER: ${{ secrets.VITE_ICP_NUMBER || '' }}
        run: pnpm --filter @promo/admin build

      - name: Build Manager
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://promo-hub.example.com/api' }}
          VITE_ICP_NUMBER: ${{ secrets.VITE_ICP_NUMBER || '' }}
        run: pnpm --filter @promo/manager build

      - name: Build User
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://promo-hub.example.com/api' }}
          VITE_ICP_NUMBER: ${{ secrets.VITE_ICP_NUMBER || '' }}
        run: pnpm --filter @promo/user build

      - name: Build API
        run: pnpm --filter @promo/api build

      - name: Upload Admin artifacts
        uses: actions/upload-artifact@v5
        with:
          name: admin-dist
          path: apps/admin/dist

      - name: Upload Manager artifacts
        uses: actions/upload-artifact@v5
        with:
          name: manager-dist
          path: apps/manager/dist

      - name: Upload User artifacts
        uses: actions/upload-artifact@v5
        with:
          name: user-dist
          path: apps/user/dist

      - name: Upload API artifacts
        uses: actions/upload-artifact@v5
        with:
          name: api-dist
          path: apps/api/dist
            
      - name: Upload Nginx config
        uses: actions/upload-artifact@v5
        with:
          name: nginx-config
          path: config/nginx.conf
          
      - name: Upload deployment scripts
        uses: actions/upload-artifact@v5
        with:
          name: scripts
          path: scripts/server-deploy.sh

  deploy:
    name: Deploy to Server
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Admin artifacts
        uses: actions/download-artifact@v5
        with:
          name: admin-dist
          path: admin-dist

      - name: Download Manager artifacts
        uses: actions/download-artifact@v5
        with:
          name: manager-dist
          path: manager-dist

      - name: Download User artifacts
        uses: actions/download-artifact@v5
        with:
          name: user-dist
          path: user-dist

      - name: Download API artifacts
        uses: actions/download-artifact@v5
        with:
          name: api-dist
          path: api-dist
          
      - name: Download Nginx config
        uses: actions/download-artifact@v5
        with:
          name: nginx-config
          path: nginx-config
          
      - name: Download deployment scripts
        uses: actions/download-artifact@v5
        with:
          name: scripts
          path: scripts

      - name: Upload Admin to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "admin-dist/"
          target: "${{ env.DEPLOY_DIR }}/admin/"
          rm: true

      - name: Upload Manager to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "manager-dist/"
          target: "${{ env.DEPLOY_DIR }}/manager/"
          rm: true

      - name: Upload User to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "user-dist/"
          target: "${{ env.DEPLOY_DIR }}/user/"
          rm: true

      - name: Upload API files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "api-dist/"
          target: "${{ env.DEPLOY_DIR }}/api/"
          rm: true
          
      - name: Configure server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            DEPLOY_DIR="/www/wwwroot/promo-hub"
            
            mkdir -p /etc/nginx/conf.d
            mkdir -p "${DEPLOY_DIR}"
            
            printf '%s\n' 'server {' '    listen 80;' '    server_name www.jlbtg.cn jlbtg.cn;' '    gzip on;' '    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;' '    gzip_min_length 1024;' > /etc/nginx/conf.d/promo-hub.conf
            
            printf '%s\n' '' '    location /.well-known/acme-challenge/ {' '        root /var/www/html;' '        allow all;' '    }' '' '    location /admin/ {' '        alias /www/wwwroot/promo-hub/admin/;' '        index index.html;' '        try_files $uri $uri/ /admin/index.html;' '    }' >> /etc/nginx/conf.d/promo-hub.conf
            
            printf '%s\n' '' '    location /manager/ {' '        alias /www/wwwroot/promo-hub/manager/;' '        index index.html;' '        try_files $uri $uri/ /manager/index.html;' '    }' >> /etc/nginx/conf.d/promo-hub.conf
            
            printf '%s\n' '' '    location /user/ {' '        alias /www/wwwroot/promo-hub/user/;' '        index index.html;' '        try_files $uri $uri/ /user/index.html;' '    }' >> /etc/nginx/conf.d/promo-hub.conf
            
            printf '%s\n' '' '    location /api/ {' '        proxy_pass http://127.0.0.1:3000/;' '        proxy_set_header Host $host;' '        proxy_set_header X-Real-IP $remote_addr;' '        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;' '        proxy_set_header X-Forwarded-Proto $scheme;' '    }' >> /etc/nginx/conf.d/promo-hub.conf
            
            printf '%s\n' '' '    location = / {' '        return 302 /user/;' '    }' '}' >> /etc/nginx/conf.d/promo-hub.conf
            
            echo "✅ Nginx配置已创建"
            
            cd "${DEPLOY_DIR}/api"

      - name: Run deployment on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            DEPLOY_DIR="/www/wwwroot/promo-hub"
            
            echo "🔍 当前工作目录: $(pwd)"
            echo "🔍 DEPLOY_DIR: ${DEPLOY_DIR}"
            
            # 调试：检查API目录文件
            echo "🔍 检查API目录内容..."
            ls -la "${DEPLOY_DIR}/api/" 2>&1 || echo "⚠️ API目录不存在或为空"
            
            # 修复：如果存在API-dist目录，复制其内容到api目录
            echo "🔍 检查API-dist是否存在..."
            if [ -d "${DEPLOY_DIR}/api/API-dist" ]; then
                echo "✅ 找到API-dist目录，正在复制内容..."
                ls -la "${DEPLOY_DIR}/api/API-dist/" 2>&1
                cp -r "${DEPLOY_DIR}/api/API-dist/"* "${DEPLOY_DIR}/api/" 2>&1
                rm -rf "${DEPLOY_DIR}/api/API-dist" 2>&1
                echo "✅ API-dist内容已复制到api目录"
            else
                echo "❌ API-dist目录不存在"
            fi
            
            # 再次检查index.js
            echo "🔍 检查index.js..."
            ls -la "${DEPLOY_DIR}/api/" 2>&1
            
            # 创建 .env 文件
            cd "${DEPLOY_DIR}/api"
            echo "DB_HOST=${{ secrets.DB_HOST }}" > .env
            echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env
            echo "DB_USER=${{ secrets.DB_USER }}" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
            echo "PORT=3000" >> .env
            echo "ALIBABA_CLOUD_ACCESS_KEY_ID=${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}" >> .env
            echo "ALIBABA_CLOUD_ACCESS_KEY_SECRET=${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}" >> .env
            echo "ALIBABA_CLOUD_SMS_SIGN_NAME=${{ secrets.ALIBABA_CLOUD_SMS_SIGN_NAME }}" >> .env
            echo "ALIBABA_CLOUD_SMS_TEMPLATE_CODE=${{ secrets.ALIBABA_CLOUD_SMS_TEMPLATE_CODE }}" >> .env
            echo "✅ .env文件已创建"
            
            # 创建package.json（如果不存在）
            if [ ! -f "package.json" ]; then
                echo '{"name":"promo-api","version":"1.0.0","type":"module","dependencies":{"bcryptjs":"^3.0.3","connect-mongo":"^5.1.0","cors":"^2.8.5","dotenv":"^17.4.2","express":"^4.21.0","express-rate-limit":"^8.5.1","express-session":"^1.18.1","multer":"^1.4.5-lts.1","mysql2":"^3.22.3","redis":"^5.12.1","uuid":"^11.0.0"}}' > package.json
                echo "✅ package.json已创建"
            fi
            
            # 安装依赖（使用--legacy-peer-deps避免依赖冲突）
            npm install --production --legacy-peer-deps 2>&1 || true
            echo "✅ npm依赖已安装"
            
            # 检查index.js是否存在
            if [ ! -f "index.js" ]; then
                echo "❌ 错误：index.js文件不存在！"
                echo "🔍 当前目录内容："
                ls -la
                exit 1
            fi
            
            # 使用PM2管理API服务
            if command -v pm2 >/dev/null 2>&1; then
                pm2 delete promo-api 2>/dev/null || true
                pm2 start index.js --name promo-api
                echo "✅ API服务已启动"
            else
                echo "⚠️ PM2未安装，跳过PM2启动"
            fi
            
            # 验证Nginx配置并重载
            nginx -t
            nginx -s reload
            echo "✅ Nginx已重载"
            
            echo ""
            echo "========================================================"
            echo " 🎉 部署完成！"
            echo "========================================================"

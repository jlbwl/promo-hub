name: Deploy to Aliyun Server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEPLOY_DIR: /www/wwwroot/promo-hub

jobs:
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type Check
        run: pnpm type-check

      - name: Test
        run: pnpm test

  build:
    name: Build Applications
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Admin
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://promo-hub.example.com/api' }}
          VITE_ICP_NUMBER: ${{ secrets.VITE_ICP_NUMBER || '' }}
        run: pnpm --filter @promo/admin build

      - name: Build Manager
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://promo-hub.example.com/api' }}
          VITE_ICP_NUMBER: ${{ secrets.VITE_ICP_NUMBER || '' }}
        run: pnpm --filter @promo/manager build

      - name: Build User
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://promo-hub.example.com/api' }}
          VITE_ICP_NUMBER: ${{ secrets.VITE_ICP_NUMBER || '' }}
        run: pnpm --filter @promo/user build

      - name: Build API
        run: pnpm --filter @promo/api build

      - name: Upload Admin artifacts
        uses: actions/upload-artifact@v5
        with:
          name: admin-dist
          path: apps/admin/dist

      - name: Upload Manager artifacts
        uses: actions/upload-artifact@v5
        with:
          name: manager-dist
          path: apps/manager/dist

      - name: Upload User artifacts
        uses: actions/upload-artifact@v5
        with:
          name: user-dist
          path: apps/user/dist

      - name: Upload API artifacts
        uses: actions/upload-artifact@v5
        with:
          name: api-dist
          path: |
            apps/api/dist
            
      - name: Upload Nginx config
        uses: actions/upload-artifact@v5
        with:
          name: nginx-config
          path: config/nginx.conf
          
      - name: Upload deployment scripts
        uses: actions/upload-artifact@v5
        with:
          name: scripts
          path: scripts/server-deploy.sh

  deploy:
    name: Deploy to Server
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Admin artifacts
        uses: actions/download-artifact@v5
        with:
          name: admin-dist
          path: admin-dist

      - name: Download Manager artifacts
        uses: actions/download-artifact@v5
        with:
          name: manager-dist
          path: manager-dist

      - name: Download User artifacts
        uses: actions/download-artifact@v5
        with:
          name: user-dist
          path: user-dist

      - name: Download API artifacts
        uses: actions/download-artifact@v5
        with:
          name: api-dist
          path: api-dist
          
      - name: Download Nginx config
        uses: actions/download-artifact@v5
        with:
          name: nginx-config
          path: nginx-config
          
      - name: Download deployment scripts
        uses: actions/download-artifact@v5
        with:
          name: scripts
          path: scripts

      - name: Upload Admin to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "admin-dist/"
          target: "${{ env.DEPLOY_DIR }}/admin/"
          rm: true

      - name: Upload Manager to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "manager-dist/"
          target: "${{ env.DEPLOY_DIR }}/manager/"
          rm: true

      - name: Upload User to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "user-dist/"
          target: "${{ env.DEPLOY_DIR }}/user/"
          rm: true

      - name: Upload API files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "api-dist/"
          target: "${{ env.DEPLOY_DIR }}/api/"
          rm: true
          
      - name: Upload Nginx config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "nginx-config/nginx.conf"
          target: "/tmp/nginx-config/"
          
      - name: Upload deployment script to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "scripts/server-deploy.sh"
          target: "/tmp/"

      - name: Run deployment on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            DEPLOY_DIR="/www/wwwroot/promo-hub"
            
            # 移动Nginx配置文件到正确位置
            if [ -f "/tmp/nginx-config/nginx.conf" ]; then
              mkdir -p /etc/nginx/conf.d
              cp /tmp/nginx-config/nginx.conf /etc/nginx/conf.d/promo-hub.conf
              echo "✅ Nginx配置已复制到 /etc/nginx/conf.d/promo-hub.conf"
            fi
            
            # 先创建 .env 文件，直接写入值
            cd "${DEPLOY_DIR}/api"
            echo "DB_HOST=${{ secrets.DB_HOST }}" > .env
            echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env
            echo "DB_USER=${{ secrets.DB_USER }}" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
            echo "PORT=3000" >> .env
            echo "ALIBABA_CLOUD_ACCESS_KEY_ID=${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}" >> .env
            echo "ALIBABA_CLOUD_ACCESS_KEY_SECRET=${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}" >> .env
            echo "ALIBABA_CLOUD_SMS_SIGN_NAME=${{ secrets.ALIBABA_CLOUD_SMS_SIGN_NAME }}" >> .env
            echo "ALIBABA_CLOUD_SMS_TEMPLATE_CODE=${{ secrets.ALIBABA_CLOUD_SMS_TEMPLATE_CODE }}" >> .env
            
            # 执行部署脚本
            chmod +x /tmp/server-deploy.sh
            bash /tmp/server-deploy.sh

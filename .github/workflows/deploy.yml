name: Deploy to Aliyun Server

on:
  push:
    branches: [main]
  workflow_dispatch:

# 防止同时运行多个部署任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEPLOY_DIR: /www/wwwroot/promo-hub

jobs:
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type Check
        run: pnpm type-check

      - name: Test
        run: pnpm test

  build:
    name: Build Applications
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Admin
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://promo-hub.example.com/api' }}
          VITE_ICP_NUMBER: ${{ secrets.VITE_ICP_NUMBER || '' }}
        run: pnpm --filter @promo/admin build

      - name: Build Manager
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://promo-hub.example.com/api' }}
          VITE_ICP_NUMBER: ${{ secrets.VITE_ICP_NUMBER || '' }}
        run: pnpm --filter @promo/manager build

      - name: Build User
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://promo-hub.example.com/api' }}
          VITE_ICP_NUMBER: ${{ secrets.VITE_ICP_NUMBER || '' }}
        run: pnpm --filter @promo/user build

      - name: Build API
        run: pnpm --filter @promo/api build

      - name: Upload Admin artifacts
        uses: actions/upload-artifact@v5
        with:
          name: admin-dist
          path: apps/admin/dist

      - name: Upload Manager artifacts
        uses: actions/upload-artifact@v5
        with:
          name: manager-dist
          path: apps/manager/dist

      - name: Upload User artifacts
        uses: actions/upload-artifact@v5
        with:
          name: user-dist
          path: apps/user/dist

      - name: Upload API artifacts
        uses: actions/upload-artifact@v5
        with:
          name: api-dist
          path: |
            apps/api/dist
            
      - name: Upload Nginx config
        uses: actions/upload-artifact@v5
        with:
          name: nginx-config
          path: config/nginx.conf

  deploy:
    name: Deploy to Server
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Admin artifacts
        uses: actions/download-artifact@v5
        with:
          name: admin-dist
          path: admin-dist

      - name: Download Manager artifacts
        uses: actions/download-artifact@v5
        with:
          name: manager-dist
          path: manager-dist

      - name: Download User artifacts
        uses: actions/download-artifact@v5
        with:
          name: user-dist
          path: user-dist

      - name: Download API artifacts
        uses: actions/download-artifact@v5
        with:
          name: api-dist
          path: api-dist
          
      - name: Download Nginx config
        uses: actions/download-artifact@v5
        with:
          name: nginx-config
          path: nginx-config

      - name: Upload Admin to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "admin-dist/*"
          target: "${{ env.DEPLOY_DIR }}/admin"
          strip_components: 1
          rm: true

      - name: Upload Manager to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "manager-dist/*"
          target: "${{ env.DEPLOY_DIR }}/manager"
          strip_components: 1
          rm: true

      - name: Upload User to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "user-dist/*"
          target: "${{ env.DEPLOY_DIR }}/user"
          strip_components: 1
          rm: true

      - name: Upload API files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "api-dist/*"
          target: "${{ env.DEPLOY_DIR }}/api"
          strip_components: 1
          rm: true

      - name: Restart API, Fix DB and Nginx
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs:
            - DB_HOST
            - DB_PORT
            - DB_USER
            - DB_PASSWORD
            - DB_NAME
          script: |
            set -e
            DEPLOY_DIR="/www/wwwroot/promo-hub"
            
            # 创建 .env 文件
              cat > "${DEPLOY_DIR}/api/.env" << 'ENVEOF'
DB_HOST={{ secrets.DB_HOST }}
DB_PORT={{ secrets.DB_PORT }}
DB_USER={{ secrets.DB_USER }}
DB_PASSWORD={{ secrets.DB_PASSWORD }}
DB_NAME={{ secrets.DB_NAME }}
PORT=3000
ALIBABA_CLOUD_ACCESS_KEY_ID={{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
ALIBABA_CLOUD_ACCESS_KEY_SECRET={{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
ALIBABA_CLOUD_SMS_SIGN_NAME={{ secrets.ALIBABA_CLOUD_SMS_SIGN_NAME }}
ALIBABA_CLOUD_SMS_TEMPLATE_CODE={{ secrets.ALIBABA_CLOUD_SMS_TEMPLATE_CODE }}
ENVEOF
            
            # 在服务器上创建并执行部署脚本
            cd "${DEPLOY_DIR}/api"
            cat > deploy-runner.sh << 'SCRIPTEOF'
#!/bin/bash
set -e
DEPLOY_DIR="/www/wwwroot/promo-hub"
NGINX_CONF="/etc/nginx/conf.d/promo-hub.conf"
rm -f "${DEPLOY_DIR}/index.html" "${DEPLOY_DIR}/index.htm" /var/www/html/index.html /usr/share/nginx/html/index.html 2>/dev/null || true
mkdir -p "${DEPLOY_DIR}/api/data/uploads"
cd "${DEPLOY_DIR}/api"
cat > package.json << 'PKGEOF'
{"name":"@promo/api","version":"1.0.0","private":true,"type":"module","scripts":{"dev":"tsx watch src/index.ts","build":"tsc","start":"node index.js"},"dependencies":{"bcryptjs":"^2.4.3","connect-mongo":"^5.1.0","cors":"^2.8.5","dotenv":"^17.4.2","express":"^4.21.0","express-rate-limit":"^8.5.1","express-session":"^1.18.1","multer":"^1.4.5-lts.1","mysql2":"^3.22.3","redis":"^5.12.1","uuid":"^11.0.0"},"devDependencies":{"@types/cors":"^2.8.17","@types/express":"^5.0.0","@types/multer":"^1.4.12","@types/uuid":"^10.0.0","tsx":"^4.19.0","typescript":"^5.7.0"}}
PKGEOF
mysql -h "${DB_HOST}" -P "${DB_PORT}" -u "${DB_USER}" -p"${DB_PASSWORD}" "${DB_NAME}" -e "ALTER TABLE orders ADD COLUMN IF NOT EXISTS teamName VARCHAR(200) DEFAULT '' AFTER userPhone, ADD COLUMN IF NOT EXISTS userName VARCHAR(200) DEFAULT '' AFTER redirectUrl, ADD COLUMN IF NOT EXISTS userPhone VARCHAR(50) DEFAULT '' AFTER userName;" 2>/dev/null || true
mysql -h "${DB_HOST}" -P "${DB_PORT}" -u "${DB_USER}" -p"${DB_PASSWORD}" "${DB_NAME}" -e "ALTER TABLE products ADD COLUMN IF NOT EXISTS requireName TINYINT(1) NOT NULL DEFAULT 0 AFTER offlineAt, ADD COLUMN IF NOT EXISTS requirePhone TINYINT(1) NOT NULL DEFAULT 0 AFTER requireName, ADD COLUMN IF NOT EXISTS categoryId VARCHAR(100) DEFAULT '' AFTER category, ADD COLUMN IF NOT EXISTS categoryNameSnapshot VARCHAR(200) DEFAULT '' AFTER categoryId;" 2>/dev/null || true
mysql -h "${DB_HOST}" -P "${DB_PORT}" -u "${DB_USER}" -p"${DB_PASSWORD}" "${DB_NAME}" -e "CREATE TABLE IF NOT EXISTS employees (id VARCHAR(100) PRIMARY KEY, userId VARCHAR(100) NOT NULL, phone VARCHAR(50) NOT NULL, password VARCHAR(500) NOT NULL, nickname VARCHAR(200) DEFAULT '', expiresAt DATETIME NOT NULL, status VARCHAR(50) NOT NULL DEFAULT 'active', createdAt DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP, updatedAt DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP, INDEX idx_userId (userId), INDEX idx_phone (phone), INDEX idx_expiresAt (expiresAt)) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;" 2>/dev/null || true
mysql -h "${DB_HOST}" -P "${DB_PORT}" -u "${DB_USER}" -p"${DB_PASSWORD}" "${DB_NAME}" -e "CREATE TABLE IF NOT EXISTS product_categories (id VARCHAR(100) PRIMARY KEY, name VARCHAR(200) NOT NULL, value VARCHAR(200) NOT NULL, sort INT NOT NULL DEFAULT 0, status VARCHAR(50) NOT NULL DEFAULT 'active', createdAt DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP, updatedAt DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;" 2>/dev/null || true
mysql -h "${DB_HOST}" -P "${DB_PORT}" -u "${DB_USER}" -p"${DB_PASSWORD}" "${DB_NAME}" -e "INSERT IGNORE INTO product_categories (id, name, value, sort, status, createdAt, updatedAt) VALUES ('cat_1', '综合-立返', 'comprehensive-instant', 1, 'active', NOW(), NOW()), ('cat_2', '综合-数据', 'comprehensive-data', 2, 'active', NOW(), NOW()), ('cat_3', '个养和加挂', 'personal-insurance', 3, 'active', NOW(), NOW()), ('cat_4', '限三-立返', 'limit3-instant', 4, 'active', NOW(), NOW()), ('cat_5', '限三-数据', 'limit3-data', 5, 'active', NOW(), NOW()), ('cat_6', '不限三-立返', 'unlimit3-instant', 6, 'active', NOW(), NOW()), ('cat_7', '不限三-数据', 'unlimit3-data', 7, 'active', NOW(), NOW()), ('cat_8', '三方-立返', 'third-party-instant', 8, 'active', NOW(), NOW()), ('cat_9', '三方-数据', 'third-party-data', 9, 'active', NOW(), NOW()), ('cat_10', '其它', 'other', 10, 'active', NOW(), NOW());" 2>/dev/null || true
pm2 stop promo-api 2>/dev/null || true
pm2 delete promo-api 2>/dev/null || true
if [ -f "dist/index.js" ]; then mv -f dist/* . 2>/dev/null || true; rm -rf dist; fi
rm -rf node_modules package-lock.json
npm install --production --no-audit
pm2 start index.js --name promo-api --cwd "${DEPLOY_DIR}/api" -f
sleep 5
mkdir -p "${DEPLOY_DIR}/nginx"
if [ -f nginx-config/nginx.conf ]; then cp nginx-config/nginx.conf "${NGINX_CONF}"; fi
cat > "${NGINX_CONF}" << 'NGINXEOF'
server {
    listen 80;
    server_name _;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;
    location = / { return 302 /user/; }
    location / { return 302 /user/; }
    location /admin/ { alias /www/wwwroot/promo-hub/admin/; index index.html; try_files $uri $uri/ /admin/index.html; }
    location /manager/ { alias /www/wwwroot/promo-hub/manager/; index index.html; try_files $uri $uri/ /manager/index.html; }
    location /user/ { alias /www/wwwroot/promo-hub/user/; index index.html; try_files $uri $uri/ /user/index.html; }
    location /api/ { proxy_pass http://127.0.0.1:3000/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
}
NGINXEOF
nginx -t && nginx -s reload
echo "部署完成！"
SCRIPTEOF
            chmod +x deploy-runner.sh
            bash deploy-runner.sh
            echo "=== 部署完成 ==="
            echo "Admin files: $(ls ${DEPLOY_DIR}/admin/ 2>/dev/null | wc -l)"
            echo "Manager files: $(ls ${DEPLOY_DIR}/manager/ 2>/dev/null | wc -l)"
            echo "User files: $(ls ${DEPLOY_DIR}/user/ 2>/dev/null | wc -l)"

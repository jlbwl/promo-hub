name: Deploy to Aliyun Server

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DEPLOY_DIR: /www/wwwroot/promo-hub

jobs:
  build:
    name: Build Applications
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Admin
        run: pnpm --filter @promo/admin build

      - name: Build Manager
        run: pnpm --filter @promo/manager build

      - name: Build User
        run: pnpm --filter @promo/user build

      - name: Build API
        run: pnpm --filter @promo/api build

      - name: Upload Admin artifacts
        uses: actions/upload-artifact@v5
        with:
          name: admin-dist
          path: apps/admin/dist

      - name: Upload Manager artifacts
        uses: actions/upload-artifact@v5
        with:
          name: manager-dist
          path: apps/manager/dist

      - name: Upload User artifacts
        uses: actions/upload-artifact@v5
        with:
          name: user-dist
          path: apps/user/dist

      - name: Upload API artifacts
        uses: actions/upload-artifact@v5
        with:
          name: api-dist
          path: |
            apps/api/dist
            apps/api/package.json
            apps/api/node_modules

  deploy:
    name: Deploy to Server
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Admin artifacts
        uses: actions/download-artifact@v5
        with:
          name: admin-dist
          path: admin-dist

      - name: Download Manager artifacts
        uses: actions/download-artifact@v5
        with:
          name: manager-dist
          path: manager-dist

      - name: Download User artifacts
        uses: actions/download-artifact@v5
        with:
          name: user-dist
          path: user-dist

      - name: Download API artifacts
        uses: actions/download-artifact@v5
        with:
          name: api-dist
          path: api-dist

      - name: Upload Admin to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "admin-dist/*"
          target: "${{ env.DEPLOY_DIR }}/admin"
          strip_components: 1
          rm: true

      - name: Upload Manager to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "manager-dist/*"
          target: "${{ env.DEPLOY_DIR }}/manager"
          strip_components: 1
          rm: true

      - name: Upload User to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "user-dist/*"
          target: "${{ env.DEPLOY_DIR }}/user"
          strip_components: 1
          rm: true

      - name: Upload API dist to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "api-dist/dist/*"
          target: "${{ env.DEPLOY_DIR }}/api/dist"
          strip_components: 2
          rm: true

      - name: Restart API and Nginx
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            mkdir -p ${{ env.DEPLOY_DIR }}/api/data/uploads
            cd ${{ env.DEPLOY_DIR }}/api

            # 创建 .env 文件（从 GitHub Secrets 读取）
            printf 'DB_HOST=%s\nDB_PORT=%s\nDB_USER=%s\nDB_PASSWORD=%s\nDB_NAME=%s\nPORT=3000\n' \
              "${{ secrets.DB_HOST }}" \
              "${{ secrets.DB_PORT }}" \
              "${{ secrets.DB_USER }}" \
              "${{ secrets.DB_PASSWORD }}" \
              "${{ secrets.DB_NAME }}" > .env

            npm install --production
            pm2 delete promo-api 2>/dev/null || true
            pm2 start dist/index.js --name promo-api --wait-ready
            pm2 restart promo-api
            pm2 save
            echo "Admin files: $(ls ${{ env.DEPLOY_DIR }}/admin/ | wc -l)"
            echo "Manager files: $(ls ${{ env.DEPLOY_DIR }}/manager/ | wc -l)"
            echo "User files: $(ls ${{ env.DEPLOY_DIR }}/user/ | wc -l)"
            nginx -s reload 2>/dev/null || true
            echo "Deploy done!"

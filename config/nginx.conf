server {
    listen 80;
    server_name www.jlbtg.cn jlbtg.cn;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Let's Encrypt ACME 验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # 所有其他 HTTP 请求重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name www.jlbtg.cn jlbtg.cn;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # SSL 证书配置
    ssl_certificate /etc/nginx/ssl/www.jlbtg.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/www.jlbtg.cn.key;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # CSP（强制模式）：浏览器实测无违规后启用，策略内容保持不变；
    # 放行依据：user 端 jweixin-1.6.0.js、Vant 图标字体 at.alicdn.com、
    # tesseract.js（worker/core/wasm）cdn.jsdelivr.net、Vant 空态图 fastly.jsdelivr.net
    set $csp_report_only "default-src 'self'; script-src 'self' https://res.wx.qq.com https://cdn.jsdelivr.net 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://fastly.jsdelivr.net; font-src 'self' data: https://at.alicdn.com; connect-src 'self' https://cdn.jsdelivr.net https://fastly.jsdelivr.net; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'";
    add_header Content-Security-Policy $csp_report_only always;

    # Favicon
    location ~* ^/favicon\.(ico|svg|png)$ {
        alias /www/wwwroot/promo-hub/user/user-dist/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri $uri/ =404;
    }

    # 带内容哈希的构建产物：一年强缓存（Vite 产物文件名含 hash，内容变化即换名）
    # chunk 缺失时直接 404，禁止 fallback 到 index.html（避免 text/html MIME 报错掩盖问题）
    location ^~ /admin/assets/ {
        alias /www/wwwroot/promo-hub/admin/admin-dist/assets/;
        expires 1y;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ^~ /manager/assets/ {
        alias /www/wwwroot/promo-hub/manager/manager-dist/assets/;
        expires 1y;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ^~ /user/assets/ {
        alias /www/wwwroot/promo-hub/user/user-dist/assets/;
        expires 1y;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 管理员后台：HTML 入口 no-cache 协商缓存，确保每次部署后浏览器立即拿到新入口
    location /admin/ {
        alias /www/wwwroot/promo-hub/admin/admin-dist/;
        index index.html;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp_report_only always;
        try_files $uri $uri/ /admin/index.html;
    }

    # 渠道经理后台
    location /manager/ {
        alias /www/wwwroot/promo-hub/manager/manager-dist/;
        index index.html;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp_report_only always;
        try_files $uri $uri/ /manager/index.html;
    }

    # 用户端
    location /user/ {
        alias /www/wwwroot/promo-hub/user/user-dist/;
        index index.html;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp_report_only always;
        try_files $uri $uri/ /user/index.html;
    }

    # 上传文件静态服务
    location /uploads/ {
        alias /www/wwwroot/promo-hub/api/data/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    # 拒绝上传目录中的可执行/可渲染脚本类文件
    location ~* ^/uploads/.*\.(html?|js|mjs|svg)$ {
        return 403;
    }

    # API 反向代理
    location /api/ { proxy_pass http://127.0.0.1:3000/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }

    # 根路径跳转到用户端
    # 微信业务域名校验文件
    location = /69584b3808d46aa560a28586227ad6c5.txt {
        alias /www/wwwroot/promo-hub/user/user-dist/69584b3808d46aa560a28586227ad6c5.txt;
        default_type text/plain;
    }
    location = /MP_verify_XGpX0TOr10ayUppj.txt {
        alias /www/wwwroot/promo-hub/user/user-dist/MP_verify_XGpX0TOr10ayUppj.txt;
        default_type text/plain;
    }
    location = / { return 302 /user/; }
}
